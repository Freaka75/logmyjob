# Lancement local : docker compose up -d --build  ->  http://localhost:8080
# Les donnees sont dans Supabase (voir frontend/js/config.js).

services:
  log-my-job:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log-my-job-app
    ports:
      - "8080:80"
    restart: unless-stopped
