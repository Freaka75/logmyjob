server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Les fichiers (JS, CSS, HTML) ne sont pas versionnes par leur nom :
    # "no-cache" = le navigateur garde sa copie mais revalide (ETag) a chaque fois.
    # Le Service Worker gere le hors-ligne de son cote.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/health {
        default_type application/json;
        return 200 '{"status": "ok", "storage": "supabase"}';
    }

    # Le Service Worker ne doit jamais etre servi depuis un cache HTTP.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Images et icones : peuvent rester en cache (elles changent rarement).
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        add_header Cache-Control "public, max-age=2592000" always;
    }
}
